[workspace]
members = ["crates/game"]
resolver = "3"

[workspace.package]
edition = "2024"
license = "MIT OR Apache-2.0"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
strip = true

[profile.wasm-release]
inherits = "release"
opt-level = "s"
lto = true
codegen-units = 1
