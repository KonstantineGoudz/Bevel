[package]
name = "party-dungeon"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[lib]
name = "party_dungeon"
crate-type = ["lib", "cdylib"]

[dependencies]
bevy = { version = "=0.20.0", features = ["android-game-activity", "system_clipboard"] }
avian3d = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["Document", "DomException", "Element", "HtmlDocument", "HtmlElement", "HtmlTextAreaElement", "Location", "Navigator", "Node", "Storage", "Window"] }
