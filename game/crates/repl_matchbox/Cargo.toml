[package]
name = "party-dungeon-repl-matchbox"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "bevy_replicon messaging backend over the existing matchbox/WebRTC transport (server + client plugins, JWT handshake, binary message channels)."

[lib]
name = "party_dungeon_repl_matchbox"
crate-type = ["lib"]

[features]
default = []
client = ["bevy_replicon/client"]
server = ["bevy_replicon/server"]
# In-memory transport + helpers so two Bevy apps can be linked in one process.
# Implies both roles (tests drive a server app and a client app together).
testkit = ["server", "client"]

[dependencies]
# `std` pulls in bevy_app/bevy_ecs/bevy_time/bevy_platform; `bevy_state` is
# needed for the replicon state transitions this backend drives.
bevy = { version = "=0.20.0", default-features = false, features = ["std", "bevy_state", "bevy_log"] }
bevy_replicon = { version = "0.45", default-features = false }
matchbox_socket = "0.15"
postcard = { version = "1", features = ["use-std"] }
serde = { version = "1", features = ["derive"] }
log = "0.4"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
futures = "0.3"
# Only for the optional `BackendRuntime` handle (drive the socket loop on the
# host's runtime instead of a private thread).
tokio = { version = "1", features = ["rt-multi-thread", "time", "sync", "net"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen-futures = "0.4"

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
# Local signaling server for the native end-to-end transport test.
matchbox_signaling = "0.15"
