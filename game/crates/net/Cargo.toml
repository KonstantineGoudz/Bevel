[package]
name = "party-dungeon-net"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Shared realtime protocol for Party Dungeon: 60Hz inputs, snapshots, events. Transport-free (postcard + serde only) so native and WASM clients share it."

[lib]
name = "party_dungeon_net"
crate-type = ["lib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
postcard = { version = "1", features = ["use-std"] }
serde_json = "1"
