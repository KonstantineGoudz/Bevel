[package]
name = "party-dungeon-replication"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Shared bevy_replicon schema for Party Dungeon: replicated components, client/server messages, visibility filters and quantized postcard serializers (binary, no JSON/protobuf)."

[lib]
name = "party_dungeon_replication"
crate-type = ["lib"]

[features]
default = []
client = ["bevy_replicon/client"]
server = ["bevy_replicon/server"]

[dependencies]
bevy = { version = "=0.20.0", default-features = false, features = ["std", "bevy_state", "bevy_log"] }
bevy_replicon = { version = "0.45", default-features = false }
party-dungeon-net = { path = "../net" }
serde = { version = "1", features = ["derive"] }
postcard = { version = "1", features = ["use-std"] }
