<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Party Dungeon — model viewer (Bevy)</title>
    <meta
      name="description"
      content="Import .glb and .gltf files, or view the models packaged with the game, in the Rust/Bevy model viewer."
    />
    <style>
      html, body {
        margin: 0;
        height: 100%;
        background: #0a0d12;
        overflow: hidden;
      }
      canvas#bevy {
        display: block;
        width: 100%;
        height: 100%;
        outline: none;
      }
      #error {
        display: none;
        margin: 24px;
        padding: 16px;
        border: 1px solid #4a2a2a;
        border-radius: 8px;
        background: #1a1012;
        color: #ff9a9a;
        font: 13px/1.5 ui-monospace, Menlo, monospace;
        white-space: pre-wrap;
      }
    </style>
  </head>
  <body>
    <canvas id="bevy"></canvas>
    <pre id="error"></pre>
    <a id="back" href="./" hidden>Back to maps</a>
    <script type="module">
      // Build stamp and package location — the same contract as game.html: one
      // immutable `pkg/<stamp>/` directory per build, chosen by the tiny
      // `pkg/build.json` manifest (fetched `no-store`, so it is never stale).
      // See web/nginx.conf and docs/web-caching.md.
      const readBuildStamp = async () => {
        try {
          const response = await fetch("./pkg/build.json", { cache: "no-store" });
          if (!response.ok) throw new Error(`HTTP ${response.status}`);
          const manifest = await response.json();
          if (typeof manifest?.build === "string" && manifest.build.length > 0) {
            return manifest.build;
          }
          throw new Error("build.json has no build stamp");
        } catch (error) {
          console.warn("pkg/build.json unavailable; falling back to uncached paths.", error);
          return null;
        }
      };

      const bootViewer = async () => {
        const build = await readBuildStamp();
        const pkg = build ? `./pkg/${encodeURIComponent(build)}` : "./pkg";
        const version = build ? "" : `?v=dev-${Date.now()}`;
        const { default: init } = await import(`${pkg}/party_dungeon.js${version}`);
        return init(`${pkg}/party_dungeon_bg.wasm${version}`);
      };

      const showError = (message) => {
        const box = document.getElementById("error");
        box.style.display = "block";
        box.textContent = message;
        document.getElementById("back").removeAttribute("hidden");
      };

      // The Rust side checks for `viewer` in the query string and boots the
      // Bevy viewer instead of the editor. Keep it in the URL so reloads stay
      // in the viewer.
      const params = new URLSearchParams(window.location.search);
      if (!params.has("viewer") && !params.has("view")) {
        params.set("viewer", "1");
        window.history.replaceState(null, "", `${window.location.pathname}?${params}`);
      }

      try {
        if (typeof localStorage === "undefined") {
          console.warn("Browser storage is unavailable; the viewer does not need it.");
        }
      } catch (error) {
        console.warn("Browser storage is unavailable; the viewer does not need it.", error);
      }

      // The Rust panel lists the models shipped in assets/. The build script
      // writes assets/models.json; fetch it before Bevy boots so the list is
      // ready when the panel is built (a missing manifest just means none).
      const packagedModelList = async () => {
        try {
          const response = await fetch("./assets/models.json", { cache: "no-store" });
          if (!response.ok) return [];
          const data = await response.json();
          return Array.isArray(data?.models)
            ? data.models.filter((name) => typeof name === "string")
            : [];
        } catch (error) {
          console.warn("Could not read the packaged model list.", error);
          return [];
        }
      };

      packagedModelList()
        .then((models) => {
          window.__packagedModels = models;
          return bootViewer();
        })
        .catch((err) => {
          showError(`Failed to start the Bevy viewer build:\n\n${err}`);
          console.error(err);
        });
    </script>
  </body>
</html>
