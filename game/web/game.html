<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Party Dungeon — editor</title>
    <style>
      html, body {
        margin: 0;
        height: 100%;
        background: #0a0d12;
        overflow: hidden;
      }
      canvas#bevy {
        display: block;
        width: 100%;
        height: 100%;
        outline: none;
      }
      #loading {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        color: #86a0b8;
        font: 14px/1.5 ui-monospace, Menlo, monospace;
        background: #0a0d12;
        z-index: 2;
      }
      #loading[hidden] { display: none; }
      #error {
        display: none;
        margin: 24px;
        padding: 16px;
        border: 1px solid #4a2a2a;
        border-radius: 8px;
        background: #1a1012;
        color: #ff9a9a;
        font: 13px/1.5 ui-monospace, Menlo, monospace;
        white-space: pre-wrap;
      }
    </style>
  </head>
  <body>
    <div id="loading">Loading map…</div>
    <canvas id="bevy"></canvas>
    <pre id="error"></pre>
    <a id="back" href="./" hidden>Back to maps</a>
    <script type="module">
      import init from "./pkg/party_dungeon.js";

      const showError = (message) => {
        const box = document.getElementById("error");
        document.getElementById("loading")?.setAttribute("hidden", "");
        box.style.display = "block";
        box.textContent = message;
        document.getElementById("back").removeAttribute("hidden");
      };

      const id = new URLSearchParams(window.location.search).get("session");
      if (!id) {
        showError("Choose a map from the maps page before opening the editor.");
      } else {
        let hasSession;
        try {
          hasSession = localStorage.getItem(`party-dungeon.session.${id}.v1`) !== null;
        } catch (error) {
          showError("Browser storage is unavailable; the map cannot be opened.");
          console.error("Could not read the saved map from browser storage.", error);
        }
        if (hasSession === false) {
          showError("This map is not available in browser storage.");
        } else if (hasSession === true) {
          init()
            .then(() => {
              document.getElementById("loading")?.setAttribute("hidden", "");
            })
            .catch((err) => {
              showError(`Failed to start the wasm build:\n\n${err}`);
              console.error(err);
            });
          // Fallback: hide after 12s so a stalled build doesn't leave a permanent overlay.
          setTimeout(() => document.getElementById("loading")?.setAttribute("hidden", ""), 12000);
        }
      }
    </script>
  </body>
</html>
