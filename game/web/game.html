<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Party Dungeon — editor</title>
    <style>
      html, body {
        margin: 0;
        height: 100%;
        background: #0a0d12;
        overflow: hidden;
      }
      canvas#bevy {
        display: block;
        width: 100%;
        height: 100%;
        outline: none;
      }
      #error {
        display: none;
        margin: 24px;
        padding: 16px;
        border: 1px solid #4a2a2a;
        border-radius: 8px;
        background: #1a1012;
        color: #ff9a9a;
        font: 13px/1.5 ui-monospace, Menlo, monospace;
        white-space: pre-wrap;
      }
    </style>
  </head>
  <body>
    <canvas id="bevy"></canvas>
    <pre id="error"></pre>
    <script type="module">
      import init from "./pkg/party_dungeon.js";

      init().catch((err) => {
        const box = document.getElementById("error");
        box.style.display = "block";
        box.textContent = `Failed to start the wasm build:\n\n${err}`;
        console.error(err);
      });
    </script>
  </body>
</html>
