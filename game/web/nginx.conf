# Cache policy for the Party Dungeon web build.
#
# Installed by `scripts/deploy-web.sh` at /etc/nginx/conf.d/default.conf inside
# the `party-dungeon-web` container (static root: `game/web/`, mounted
# read-only). See docs/web-caching.md for the whole scheme.
#
# Why this exists: the client is one large wasm module (~50 MB in a release
# build, ~197 MB wasm-dev), and the stock nginx config sends no Cache-Control at
# all — so the browser re-downloaded the whole module on almost every load. The
# build now publishes one immutable directory per build (`pkg/<stamp>/…`) plus a
# tiny `pkg/build.json` manifest naming the live stamp. Pages fetch the manifest
# with `no-store` and load the stamp's directory, therefore:
#
#   - a reload of an unchanged build transfers only revalidations (a few
#     hundred bytes), never the wasm;
#   - a new build gets a new stamp → new URLs → the module is downloaded once;
#   - old build directories are kept (default: 2), and writing a previous stamp
#     into build.json is a complete, instant rollback — no files move;
#   - JS glue and wasm always come from the same stamp directory, so a page can
#     never mix an old `party_dungeon.js` with a new `party_dungeon_bg.wasm`
#     (which is what the old "no-store everywhere" dev server was guarding
#     against).

server {
    listen       80;
    listen  [::]:80;
    server_name  _;

    root  /usr/share/nginx/html;
    index index.html;

    # Serve the precompressed `.gz` file written next to each big artifact
    # (`build-web.sh` gzips the wasm: ~11.7 MB on the wire for a release build,
    # ~28 MB for wasm-dev). Dynamic gzip stays on for documents and any artifact
    # a rebuild forgot to precompress, but deliberately NOT for
    # application/wasm: compressing 50–200 MB on the fly would occupy a worker
    # per request, and the build always writes the `.gz`.
    gzip_static     on;
    gzip            on;
    gzip_vary       on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types      application/javascript text/css application/json image/svg+xml text/plain;

    # Entry documents. Revalidating on every navigation is how a deploy becomes
    # visible; `no-cache` keeps the ETag, so the usual reload is a 304, not a
    # re-download.
    location ~* \.html?$ {
        add_header Cache-Control "no-cache" always;
    }

    # The build manifest IS the live pointer: never let any cache hold it.
    # `curl https://play.conman.biz/pkg/build.json` is also the deployment probe.
    location = /pkg/build.json {
        add_header Cache-Control "no-store" always;
    }

    # One directory per build, immutable by construction: a stamp path is only
    # ever served the artifact built under it.
    location /pkg/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        # `always` would also stamp a one-year lifetime on an error response, and
        # a browser that caches that keeps the URL dead for a year. A missing
        # stamp is a deploy mistake (or a pruned old build), and a directory URL
        # is only ever probed by hand: answer both uncached.
        error_page 403 404 = @pkg_missing;
    }

    location @pkg_missing {
        add_header Cache-Control "no-store" always;
        return 404;
    }

    # Bevy loads assets by path fixed in the binary (`/assets/character.glb`), so
    # they cannot carry a version. Revalidate with the ETag instead: a 304 costs
    # a few hundred bytes, and a changed asset is picked up on the next build.
    location /assets/ {
        add_header Cache-Control "no-cache" always;
    }

    # Anything else (viewer.html, stray files): revalidate.
    location / {
        add_header Cache-Control "no-cache" always;
    }

    # This file lives in the served tree; it is not part of the site.
    location = /nginx.conf {
        deny all;
    }
}
